<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="../img/favicon/favicon-32x32.png" type="image/x-icon">
    <link rel="stylesheet" href="./cssextra/contato.css">
    
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet"/>
    <title>Contato</title>
</head>

<br><br><br><br>
<body>
<div class="wrapper"> 
  <h1>Formulário de Contato:</h1>
  <form action="contatosandreteste@gmail.com" method="post">
   <div class="form" id="name">
    <label for="name"><i class="ri-user-fill"></i></label>
    <input type="text" id="name" required>
    </div>
    <div class="form" id="email">
    <label for="email"><i class="ri-mail-fill"></i></label>
    <input type="email" id="email" placeholder="exemplo@gmail.com" required>
    </div>
    <div class="form" id="tell">
    <label for="tell"><i class="ri-phone-fill"></i></label>
    <input type="tel" id="tell" required>
    </div>

    <div class="form1" id="select">
        <select id="servico" name="servico" required>
            <option value="">Selecione um serviço</option>
            <option value="LandPage">LandPage Completa</option>
            <option value="LandPageA">LandPage Avançada</option>
            <option value="CSS">CSS</option>
            <option value="HTML">HTML</option>
            <option value="JavaScript">JavaScript</option>
            <option value="HTML + CSS">HTML + CSS</option>
            <option value="CSS + JavaScript">CSS + JavaScript</option>
        </select>
    </div>
    <div class="form" id="PoliticaDePrivacidade">
        <p> Ao enviar, você concorda com a <a href="#" id="politica">Política de Privacidade</a></p>
       
    </div>
    <div class="politics"> 
        <input type="checkbox" id="fine-print" value="agree" required>
        <p>Concordo com a Política de Privacidade</p>
    </div>
    <div class="buttons" id="buttons">
    <button type="submit">Enviar</button>
    <button type="reset">Limpar</button>
    </div>
</form>
<div><button><i class="ri-home-fill"></i><a href="../../index.html" id="voltar"> VOLTAR</a></button></div>
</div>
<script src="https://unpkg.com/scrollreveal"></script>
    <script src="../../main.js"></script>
</body>
</html>
